    <rect x="640" y="220" width="280" height="200" rx="28" fill="url(#panelDark)"/>
    <rect x="520" y="500" width="360" height="160" rx="32" fill="url(#panel)"/>
  </g>
  <g fill="none" stroke-linecap="round">
